version: 2
updates:

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "production"
    groups:
      # Specify a name for the group, which will be used in pull request titles
      # and branch names
      minor-updates:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
  
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "development"
    groups:
      dev-updates:
        applies-to: version-updates

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    groups:
      group-updates:
        applies-to: version-updates

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    group-updates:
        applies-to: version-updates
