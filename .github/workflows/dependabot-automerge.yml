name: Dependabot Auto-merge

# Trusted workflow: runs with a write token from the base branch.
# It must NEVER check out, import or execute pull request code.
on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Dependabot auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only patch and minor updates (the highest type for grouped PRs) qualify.
      # GitHub's required status checks still gate the actual merge.
      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash \
            --match-head-commit "$PR_HEAD_SHA"
          echo "Auto-merge enabled (squash) for PR #${PR_NUMBER}; it will merge once required checks pass." >> "$GITHUB_STEP_SUMMARY"

      # Major, empty and unrecognised update types stay with a human.
      - name: Leave other updates for human review
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          enabled="$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$enabled" = "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto
            echo "Disabled existing auto-merge on PR #${PR_NUMBER}." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Human review needed for PR #${PR_NUMBER} (update type: '${UPDATE_TYPE:-none}'); not eligible for auto-merge." >> "$GITHUB_STEP_SUMMARY"
